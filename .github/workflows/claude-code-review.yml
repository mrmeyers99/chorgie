name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Secrets aren't available to PRs from forks, and drafts aren't ready for review.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1
        with:
          # Uses a Claude Pro/Max subscription token from `claude setup-token`, not an API key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action rejects bot-triggered runs by default; allow Renovate's dependency PRs.
          allowed_bots: 'renovate'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Focus on:
            - Bugs and correctness issues, including edge cases
            - Security problems
            - Performance problems
            - Readability and maintainability, where it actually matters

            Only flag real problems; skip nitpicks and style preferences.

            IMPORTANT: Your final text reply is NOT visible to anyone. The only
            way to deliver the review is by posting it to the PR:
            - For issues tied to specific lines, use
              mcp__github_inline_comment__create_inline_comment.
            - You MUST always finish by posting exactly one top-level summary,
              in one of two ways:
              - If there are NO blocking issues, approve the PR and put the
                summary in the approval:
                `gh pr review ${{ github.event.pull_request.number }} --approve --body "..."`.
                Non-blocking suggestions are fine to mention in the summary.
              - Otherwise, post the summary as a comment with
                `gh pr comment ${{ github.event.pull_request.number }} --body "..."`
                and clearly list the blocking issues.

            A blocking issue is one that should stop the merge: a bug, a
            security problem, a real performance regression, or broken
            behavior. Readability and maintainability notes are not blocking
            unless they hide a bug.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
