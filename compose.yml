name: chorgie

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: chorgie
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    command: sh -c "npm run migrate:up --workspace api && npm run dev --workspace api"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/chorgie
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ORIGIN: http://localhost:5173
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - root-node-modules:/workspace/node_modules
      - api-node-modules:/workspace/api/node_modules
      - web-node-modules:/workspace/web/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    command: npm run dev --workspace web -- --host 0.0.0.0 --port 5173
    environment:
      VITE_API_URL: http://localhost:3000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - root-node-modules:/workspace/node_modules
      - api-node-modules:/workspace/api/node_modules
      - web-node-modules:/workspace/web/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  root-node-modules:
  api-node-modules:
  web-node-modules:
